<!-- bot-buttons.html এর স্ক্রিপ্ট আপডেট করুন -->
  <script type="module">
    import { db, doc, setDoc, getDoc } from "./firebase-config.js";

    lucide.createIcons();

    window.toggleSidebar = function() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.toggle('hidden');
    };

    // ৪টি ট্যাবের বাটন ডাটাবেস
    window.buttonData = {
      main: [
        { id: 'm1', label: '🛍️ Products', action: 'show_products', row: 1, active: true },
        { id: 'm2', label: '👤 Profile', action: 'show_profile', row: 2, active: true },
        { id: 'm3', label: '💳 Wallet', action: 'show_wallet', row: 2, active: true },
        { id: 'm4', label: '☎️ Help', action: 'show_support', row: 3, active: true },
        { id: 'm5', label: '🎁 Referrals', action: 'show_ref', row: 3, active: true },
        { id: 'm6', label: '📜 Bot Policy', action: 'show_policy', row: 4, active: true },
      ],
      wallet: [
        { id: 'w1', label: '➕ Top up', action: 'wallet_topup', row: 1, active: true },
        { id: 'w2', label: '🎟️ Deposit code', action: 'wallet_code', row: 2, active: true }
      ]
    };

    window.currentTab = 'main';
    window.currentEditingBtn = null;

    // Firebase থেকে আগে সেভ করা বাটন লোড করা
    async function loadButtonsFromFirebase() {
      try {
        const snap = await getDoc(doc(db, "settings", "bot_layout"));
        if (snap.exists() && snap.data().buttons) {
          window.buttonData = snap.data().buttons;
        }
      } catch(e) {
        console.log("Using default buttons");
      }
      renderKeyboardBuilder();
    }
    loadButtonsFromFirebase();

    window.switchTab = function(tab) {
      window.currentTab = tab;
      ['main', 'wallet'].forEach(t => {
        const btn = document.getElementById(`tab-btn-${t}`);
        if(btn) btn.className = (t === tab) ? 'pb-2.5 tab-active' : 'pb-2.5 text-gray-500 hover:text-gray-800';
      });
      renderKeyboardBuilder();
    };

    window.renderKeyboardBuilder = function() {
      const list = window.buttonData[window.currentTab] || [];
      const gridContainer = document.getElementById('keyboard-grid-container');
      const liveGrid = document.getElementById('live-preview-grid');
      if (!gridContainer || !liveGrid) return;

      gridContainer.innerHTML = '';
      liveGrid.innerHTML = '';

      const rows = {};
      list.forEach(btn => {
        if (!rows[btn.row]) rows[btn.row] = [];
        rows[btn.row].push(btn);
      });

      Object.keys(rows).forEach(rowNum => {
        const rowBtns = rows[rowNum];
        let rowHtml = `<div class="flex items-center gap-2 mb-2"><span class="text-[10px] font-bold text-gray-400 w-3">${rowNum}</span><div class="grid grid-cols-1 sm:grid-cols-3 gap-2 flex-1">`;
        let previewRowHtml = `<div class="flex gap-1 w-full">`;

        rowBtns.forEach(b => {
          rowHtml += `
            <div class="border ${b.active ? 'border-purple-200 bg-purple-50/40' : 'border-gray-200 bg-gray-50 opacity-60'} rounded-xl p-2.5 space-y-2">
              <div class="flex justify-between items-center">
                <span class="font-bold text-xs text-gray-800 truncate">${b.label}</span>
              </div>
              <div class="flex items-center justify-between text-gray-400 text-[10px] pt-1 border-t border-purple-100">
                <button onclick="togglePower('${b.id}')" class="p-1 ${b.active ? 'text-purple-600' : 'text-gray-400'}"><i data-lucide="power" class="w-3 h-3"></i></button>
                <button onclick="openButtonEdit('${b.id}')" class="p-1 hover:text-purple-600"><i data-lucide="eye" class="w-3 h-3"></i></button>
              </div>
            </div>
          `;
          if (b.active) {
            previewRowHtml += `<button class="flex-1 py-1.5 px-2 rounded-lg text-center font-medium bg-[#27303f] text-white border border-[#334155] text-xs truncate">${b.label}</button>`;
          }
        });

        rowHtml += `</div></div>`;
        previewRowHtml += `</div>`;
        gridContainer.innerHTML += rowHtml;
        liveGrid.innerHTML += previewRowHtml;
      });
      lucide.createIcons();
    };

    window.togglePower = function(id) {
      const btn = window.buttonData[window.currentTab].find(b => b.id === id);
      if(btn) { btn.active = !btn.active; renderKeyboardBuilder(); }
    };

    window.openButtonEdit = function(id) {
      const btn = window.buttonData[window.currentTab].find(b => b.id === id);
      if(!btn) return;
      window.currentEditingBtn = btn;
      document.getElementById('edit-btn-title').innerText = btn.label;
      document.getElementById('edit-label-en').value = btn.label;
      document.getElementById('view-keyboard-builder').classList.add('hidden');
      document.getElementById('view-button-edit').classList.remove('hidden');
    };

    window.backToBuilder = function() {
      document.getElementById('view-button-edit').classList.add('hidden');
      document.getElementById('view-keyboard-builder').classList.remove('hidden');
      renderKeyboardBuilder();
    };

    window.saveSingleButtonEdit = function() {
      if(window.currentEditingBtn) {
        window.currentEditingBtn.label = document.getElementById('edit-label-en').value;
      }
      backToBuilder();
    };

    // FIREBASE-এ সম্পূর্ণ লেআউট সেভ করা
    window.saveAllChanges = async function() {
      try {
        await setDoc(doc(db, "settings", "bot_layout"), {
          buttons: window.buttonData,
          updatedAt: new Date()
        });
        alert("টেলিগ্রাম বটের সমস্ত বাটন Firebase-এ সেভ হয়েছে! বট এখন এই লেআউট অনুযায়ী দেখাবে।");
      } catch(err) {
        alert("ত্রুটি: " + err.message);
      }
    };
  </script>
